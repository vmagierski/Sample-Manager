name: Release

# Push a version tag (v0.1.0, …) to build the app and attach it to a GitHub
# release for that tag. Run it by hand (Actions → Release → Run workflow) to
# build without publishing: the files are kept as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci # also rebuilds better-sqlite3 for Electron
      - run: npm test
      - name: Build
        run: >
          npx electron-builder --mac dmg zip --arm64 --publish never
          -c.artifactName='Sample-Manager-${version}-mac-${arch}.${ext}'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # ad-hoc signed (identity "-"), no certificate
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true
          body: |
            ## Install (macOS, Apple Silicon)

            1. Download the `-mac-arm64.dmg` below, open it and drag **Sample Manager** to Applications.
            2. The app isn't notarized by Apple, so the first launch is blocked. Open it once, then go to **System Settings → Privacy & Security** and click **Open Anyway**. Or, in Terminal:
               ```
               xattr -dr com.apple.quarantine "/Applications/Sample Manager.app"
               ```
            3. Press **⌘O** to add a sample folder.
