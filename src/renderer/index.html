<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Sample Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="header">
    <div class="side left">
      <div class="nav">
        <button id="back" title="Back (⌘[)" disabled>‹</button>
        <button id="fwd" title="Forward (⌘])" disabled>›</button>
      </div>
      <button id="random" title="Random sample from the current filters — or the whole library if none (R). ⇧-click (⇧R): also loop a random part of it">⤮ Random</button>
    </div>
    <div id="searchbox">
      <div id="chips" hidden></div>
      <input id="search" type="search" placeholder="Search names, folders, tags   /" spellcheck="false" autocomplete="off">
      <ul id="suggest" hidden></ul>
    </div>
    <div class="side right">
      <span id="status"></span>
      <span id="flash"></span>
      <span id="count"></span>
    </div>
  </header>

  <div id="body">
    <aside id="rail">
      <section id="folder-section">
        <h3>
          <button id="folders-toggle" class="sec-toggle" aria-expanded="true" title="Show / hide folders"><span class="chev">▾</span> Folders</button>
          <input id="folder-filter" class="rail-filter" type="search" placeholder="Filter…" title="Filter the folder tree (fuzzy)" spellcheck="false" autocomplete="off">
          <span class="actions">
            <button id="folders-menu" class="link more" title="Add folder, rescan, collapse all…">⋯</button>
          </span>
        </h3>
        <div id="folder-chips" class="rail-chips" hidden></div>
        <ul id="folders"></ul>
      </section>
      <section id="tag-section">
        <h3>
          <button id="tags-toggle" class="sec-toggle" aria-expanded="true" title="Show / hide tags"><span class="chev">▾</span> Tags</button>
          <input id="tag-filter" class="rail-filter" type="search" placeholder="Filter…" title="Filter the tag list (fuzzy)" spellcheck="false" autocomplete="off">
        </h3>
        <div id="tag-chips" class="rail-chips" hidden></div>
        <ul id="tags"></ul>
      </section>
      <div id="rail-grip" title="Drag to resize the sidebar · double-click to reset"></div>
    </aside>

    <main id="main">
      <div id="list-head" class="row head">
        <span class="c-name">Name</span>
        <span class="c-tags">Tags</span>
        <span class="c-fmt">Format</span>
        <span class="c-dur">Time</span>
      </div>
      <div id="list" tabindex="-1">
        <div id="spacer"></div>
        <div id="rows"></div>
      </div>
      <div id="empty" hidden></div>
    </main>
  </div>

  <footer id="player">
    <div id="player-grip" title="Drag to resize the waveform · double-click to reset"></div>
    <div class="player-bar">
      <div class="group transport">
        <button id="play" title="Play / pause (space)">▶</button>
        <button id="loop" class="icon-toggle" aria-pressed="false" title="Loop: off (L)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>
          </svg>
        </button>
      </div>
      <div id="now-name">Nothing playing</div>
      <span id="crop-info" class="off" title="Dragging this sample out drags just the crop"><span id="crop-len"></span><button id="crop-clear" class="link" title="Clear crop (double-click waveform)">✕</button></span>
      <span id="time">0:00 / 0:00</span>
      <div class="group listen">
        <label class="toggle" title="Play samples as you move through the list"><input type="checkbox" id="autoplay" checked> Auto-play</label>
        <label class="vol" id="vol-label" title="Volume: 0 dB">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
          <input type="range" id="volume" min="0" max="100" step="1" value="50">
        </label>
      </div>
      <div class="group capture">
        <button id="rec" title="Record what plays (saved as WAV)">● Rec</button>
        <button id="recall" title="Save the last 10 seconds you heard">⟲ Last 10s</button>
      </div>
    </div>
    <div id="wave-wrap">
      <canvas id="wave" title="Drag to crop · drag edges to resize, inside to move · double-click to clear · I / O set start / end · ⌥-scroll to zoom"></canvas>
      <div id="crop-bar" hidden>
        <span id="crop-drag" draggable="true" title="Drag just the crop into Logic, a Finder window or the Desktop">⠿ Drag crop</span>
        <button id="crop-save" title="Save the crop as a WAV file…">Save…</button>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
